<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title>PLAIOS architecture</title>
  <desc>Application layer (channels and the SDK contracts), kernel layer (host and runtime pipeline with pluggable slots), resource layer.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bus" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sdk" x1="0" x2="1">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1600" height="1000" rx="14" fill="#0b0f17"/>
  <rect width="1600" height="1000" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1599" height="999" rx="14" fill="none" stroke="#1f2937"/>

  <!-- window chrome -->
  <path d="M14,0.5 H1586 a13.5,13.5 0 0 1 13.5,13.5 V46 H0.5 V14 A13.5,13.5 0 0 1 14,0.5 z" fill="#111827" stroke="#1f2937"/>
  <circle cx="30" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="24" r="7" fill="#febc2e"/>
  <circle cx="78" cy="24" r="7" fill="#28c840"/>
  <text x="800" y="29" text-anchor="middle" font-size="14" fill="#64748b">~/plaios — architecture</text>

  <!-- ============ APPLICATION LAYER ============ -->
  <text x="1560" y="84" text-anchor="end" font-size="13" fill="#475569" letter-spacing="3">APPLICATION LAYER</text>

  <rect x="40" y="100" width="1520" height="96" rx="10" fill="#0f1a14" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="64" y="144" font-size="24" font-weight="700" fill="#e2e8f0">Channels</text>
  <text x="64" y="170" font-size="12" fill="#4ade80">kind: input · output</text>
  <g font-size="15" fill="#d1fae5">
    <g transform="translate(300,124)"><rect width="190" height="48" rx="8" fill="#052e16" stroke="#22c55e" stroke-opacity="0.6"/><text x="16" y="30"><tspan fill="#4ade80">❯</tspan> web-chat</text></g>
    <g transform="translate(508,124)"><rect width="190" height="48" rx="8" fill="#052e16" stroke="#22c55e" stroke-opacity="0.6"/><text x="16" y="30"><tspan fill="#4ade80">❯</tspan> telegram</text></g>
    <g transform="translate(716,124)"><rect width="190" height="48" rx="8" fill="#052e16" stroke="#22c55e" stroke-opacity="0.6"/><text x="16" y="30"><tspan fill="#4ade80">❯</tspan> voice-live</text></g>
    <g transform="translate(924,124)"><rect width="190" height="48" rx="8" fill="#052e16" stroke="#22c55e" stroke-opacity="0.6"/><text x="16" y="30"><tspan fill="#4ade80">❯</tspan> openai-api</text></g>
    <g transform="translate(1132,124)"><rect width="190" height="48" rx="8" fill="#052e16" stroke="#22c55e" stroke-opacity="0.6"/><text x="16" y="30"><tspan fill="#4ade80">❯</tspan> cronjob</text></g>
    <g transform="translate(1340,124)"><rect width="196" height="48" rx="8" fill="none" stroke="#22c55e" stroke-opacity="0.6" stroke-dasharray="5 4"/><text x="16" y="30" fill="#4ade80">+ your plugin</text></g>
  </g>

  <line x1="800" y1="200" x2="800" y2="256" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- SDK -->
  <rect x="540" y="260" width="520" height="64" rx="10" fill="url(#sdk)" stroke="#22d3ee" filter="url(#glow)"/>
  <rect x="540" y="260" width="520" height="64" rx="10" fill="#0b1220" fill-opacity="0.55" stroke="#22d3ee"/>
  <text x="800" y="293" text-anchor="middle" font-size="24" font-weight="700" fill="#e0f2fe">@plaios/core</text>
  <text x="800" y="314" text-anchor="middle" font-size="12" fill="#67e8f9">SDK · typed contracts every plugin implements</text>

  <!-- left annotation: plugin side -->
  <g font-size="13" fill="#94a3b8">
    <text x="64" y="252">agent-os.package.yaml</text>
    <text x="64" y="274">class implements Interface</text>
    <text x="64" y="296">web/ microfrontend + css</text>
  </g>
  <path d="M290,240 h8 v62 h-8" fill="none" stroke="#475569"/>
  <text x="312" y="275" font-size="15" fill="#e2e8f0">Plugin packages</text>
  <line x1="454" y1="270" x2="536" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="230,306 230,412" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- right annotation: model side -->
  <line x1="1064" y1="290" x2="1146" y2="270" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)"/>
  <text x="1158" y="275" font-size="15" fill="#e2e8f0">Model side</text>
  <path d="M1268,240 h-8 v62 h8" fill="none" stroke="#475569"/>
  <g font-size="13" fill="#94a3b8">
    <text x="1282" y="252">reasoning &amp; planning</text>
    <text x="1282" y="274">strict JSON tool calls</text>
    <text x="1282" y="296">OpenUI chat components</text>
  </g>
  <polyline points="1210,290 1210,412" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="40" y1="350" x2="1560" y2="350" stroke="#334155" stroke-dasharray="8 6"/>
  <text x="1560" y="380" text-anchor="end" font-size="13" fill="#475569" letter-spacing="3">KERNEL LAYER</text>

  <!-- ============ KERNEL LAYER ============ -->
  <!-- host: L-shaped panel wrapping the injection bus -->
  <path d="M50,416 H420 V704 H1550 V790 H50 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="70" y="452" font-size="22" font-weight="700" fill="#e2e8f0">Host</text>
  <text x="140" y="452" font-size="13" fill="#64748b">app-dynamic</text>
  <g font-size="15" fill="#cbd5e1">
    <g transform="translate(70,472)"><rect width="300" height="38" rx="7" fill="#111827" stroke="#475569"/><text x="14" y="25"><tspan fill="#64748b">01</tspan>  Package Installer</text></g>
    <g transform="translate(70,522)"><rect width="300" height="38" rx="7" fill="#111827" stroke="#475569"/><text x="14" y="25"><tspan fill="#64748b">02</tspan>  Manifest Loader</text></g>
    <g transform="translate(70,572)"><rect width="300" height="38" rx="7" fill="#111827" stroke="#475569"/><text x="14" y="25"><tspan fill="#64748b">03</tspan>  Dependency Injector</text></g>
    <g transform="translate(70,622)"><rect width="300" height="38" rx="7" fill="#111827" stroke="#475569"/><text x="14" y="25"><tspan fill="#64748b">04</tspan>  Store · hot install</text></g>
    <g transform="translate(70,672)"><rect width="300" height="38" rx="7" fill="#111827" stroke="#475569"/><text x="14" y="25"><tspan fill="#64748b">05</tspan>  Control Plane :3100</text></g>
  </g>
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <line x1="374" y1="491" x2="394" y2="491"/>
    <line x1="374" y1="541" x2="394" y2="541"/>
    <line x1="374" y1="591" x2="394" y2="591"/>
    <line x1="374" y1="641" x2="394" y2="641"/>
    <line x1="374" y1="691" x2="394" y2="691"/>
    <polyline points="394,491 394,747 446,747" marker-end="url(#arrow)"/>
  </g>

  <!-- kernel -->
  <rect x="446" y="416" width="1104" height="270" rx="10" fill="#111735" stroke="#6366f1" stroke-opacity="0.7"/>
  <text x="998" y="452" text-anchor="middle" font-size="24" font-weight="700" fill="#e0e7ff">PLAIOS Kernel</text>

  <rect x="466" y="470" width="1064" height="46" rx="8" fill="url(#bus)" stroke="#a78bfa"/>
  <text x="998" y="499" text-anchor="middle" font-size="15" fill="#ede9fe"><tspan font-weight="700">Runtime pipeline</tspan><tspan fill="#a78bfa">   input ▸ memory ▸ orchestrate ▸ agent loop ▸ output ▸ remember</tspan></text>

  <!-- slots -->
  <g stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="524" y1="520" x2="524" y2="572"/>
    <line x1="642" y1="520" x2="642" y2="572"/>
    <line x1="760" y1="520" x2="760" y2="572"/>
    <line x1="878" y1="520" x2="878" y2="572"/>
    <line x1="996" y1="520" x2="996" y2="572"/>
    <line x1="1114" y1="520" x2="1114" y2="572"/>
    <line x1="1232" y1="520" x2="1232" y2="572"/>
    <line x1="1350" y1="520" x2="1350" y2="572"/>
    <line x1="1468" y1="520" x2="1468" y2="572"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <g transform="translate(470,576)"><rect width="108" height="86" rx="8" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6"/><text x="54" y="22" font-size="11" font-weight="400" fill="#f472b6">system2</text><text x="54" y="48" fill="#fce7f3">LLM</text><text x="54" y="68" fill="#fce7f3">Core</text></g>
    <g transform="translate(588,576)"><rect width="108" height="86" rx="8" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185"/><text x="54" y="22" font-size="11" font-weight="400" fill="#fb7185">system1</text><text x="54" y="48" fill="#ffe4e6">Fast</text><text x="54" y="68" fill="#ffe4e6">Model</text></g>
    <g transform="translate(706,576)"><rect width="108" height="86" rx="8" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa"/><text x="54" y="22" font-size="11" font-weight="400" fill="#a78bfa">orchestrator</text><text x="54" y="48" fill="#ede9fe">Turn</text><text x="54" y="68" fill="#ede9fe">Router</text></g>
    <g transform="translate(824,576)"><rect width="108" height="86" rx="8" fill="#34d399" fill-opacity="0.12" stroke="#34d399"/><text x="54" y="22" font-size="11" font-weight="400" fill="#34d399">agent</text><text x="54" y="48" fill="#d1fae5">Agent</text><text x="54" y="68" fill="#d1fae5">Loop</text></g>
    <g transform="translate(942,576)"><rect width="108" height="86" rx="8" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c"/><text x="54" y="22" font-size="11" font-weight="400" fill="#fb923c">memory</text><text x="54" y="48" fill="#ffedd5">Memory</text><text x="54" y="68" fill="#ffedd5">Graph</text></g>
    <g transform="translate(1060,576)"><rect width="108" height="86" rx="8" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee"/><text x="54" y="22" font-size="11" font-weight="400" fill="#22d3ee">discovery</text><text x="54" y="48" fill="#cffafe">Tool</text><text x="54" y="68" fill="#cffafe">Registry</text></g>
    <g transform="translate(1178,576)"><rect width="108" height="86" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24"/><text x="54" y="22" font-size="11" font-weight="400" fill="#fbbf24">database</text><text x="54" y="48" fill="#fef3c7">Scoped</text><text x="54" y="68" fill="#fef3c7">Storage</text></g>
    <g transform="translate(1296,576)"><rect width="108" height="86" rx="8" fill="#94a3b8" fill-opacity="0.12" stroke="#94a3b8"/><text x="54" y="22" font-size="11" font-weight="400" fill="#94a3b8">env</text><text x="54" y="48" fill="#f1f5f9">Secrets</text><text x="54" y="68" fill="#f1f5f9">&amp; Config</text></g>
    <g transform="translate(1414,576)"><rect width="108" height="86" rx="8" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635"/><text x="54" y="22" font-size="11" font-weight="400" fill="#a3e635">action</text><text x="54" y="48" fill="#ecfccb">Tools</text><text x="54" y="68" fill="#ecfccb">&amp; Skills</text></g>
  </g>

  <!-- injection bus -->
  <line x1="998" y1="690" x2="998" y2="724" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="450" y="726" width="1080" height="44" rx="8" fill="#0b1220" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="990" y="754" text-anchor="middle" font-size="15" fill="#e2e8f0"><tspan font-weight="700">Injection bus</tspan><tspan fill="#94a3b8">   required: [env, system2, discovery, database] ▸ constructor(options)</tspan></text>

  <line x1="40" y1="816" x2="1560" y2="816" stroke="#334155" stroke-dasharray="8 6"/>
  <text x="1560" y="846" text-anchor="end" font-size="13" fill="#475569" letter-spacing="3">RESOURCE LAYER</text>

  <!-- ============ RESOURCE LAYER ============ -->
  <line x1="230" y1="794" x2="230" y2="872" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="40" y="876" width="1520" height="96" rx="10" fill="#111827" stroke="#334155"/>
  <text x="64" y="922" font-size="24" font-weight="700" fill="#e2e8f0">Resources</text>
  <text x="64" y="948" font-size="12" fill="#64748b">outside the process</text>
  <g font-size="15" fill="#cbd5e1" text-anchor="middle">
    <g transform="translate(300,900)"><rect width="190" height="48" rx="8" fill="#0b0f17" stroke="#475569"/><text x="95" y="30">npm registry</text></g>
    <g transform="translate(508,900)"><rect width="190" height="48" rx="8" fill="#0b0f17" stroke="#475569"/><text x="95" y="30">.agent-os/runtime</text></g>
    <g transform="translate(716,900)"><rect width="190" height="48" rx="8" fill="#0b0f17" stroke="#475569"/><text x="95" y="30">SQLite</text></g>
    <g transform="translate(924,900)"><rect width="190" height="48" rx="8" fill="#0b0f17" stroke="#475569"/><text x="95" y="30">.env secrets</text></g>
    <g transform="translate(1132,900)"><rect width="190" height="48" rx="8" fill="#0b0f17" stroke="#475569"/><text x="95" y="30">Model APIs</text></g>
    <g transform="translate(1340,900)"><rect width="196" height="48" rx="8" fill="#0b0f17" stroke="#475569"/><text x="98" y="30">Home · Web · SaaS</text></g>
  </g>
</svg>
