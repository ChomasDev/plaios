<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title>PLAIOS: how one message flows</title>
  <desc>An input fires; the runtime recalls memory, saves the turn, asks the orchestrator which tools and output to use, stores proposed memories, runs the agent loop (model and actions found through discovery), delivers through outputs and keeps the answer in memory.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1e293b"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1600" height="1000" rx="14" fill="#0b0f17"/>
  <rect width="1600" height="1000" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1599" height="999" rx="14" fill="none" stroke="#1f2937"/>

  <!-- window chrome -->
  <path d="M14,0.5 H1586 a13.5,13.5 0 0 1 13.5,13.5 V46 H0.5 V14 A13.5,13.5 0 0 1 14,0.5 z" fill="#111827" stroke="#1f2937"/>
  <circle cx="30" cy="24" r="7" fill="#ff5f57"/><circle cx="54" cy="24" r="7" fill="#febc2e"/><circle cx="78" cy="24" r="7" fill="#28c840"/>
  <text x="800" y="29" text-anchor="middle" font-size="14" fill="#64748b">~/plaios — one message, end to end</text>

  <text x="40" y="92" font-size="22" font-weight="700" fill="#e2e8f0">PLAIOS <tspan fill="#64748b" font-weight="400">// message flow</tspan></text>
  <g font-size="12" fill="#94a3b8">
    <line x1="1080" y1="87" x2="1120" y2="87" stroke="#64748b" stroke-width="2"/><text x="1128" y="91">per message</text>
    <line x1="1240" y1="87" x2="1280" y2="87" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/><text x="1288" y="91">boot / injected</text>
    <circle cx="1432" cy="87" r="9" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="1432" y="91" text-anchor="middle" font-size="10" font-weight="700">n</text><text x="1448" y="91">step order</text>
  </g>

  <!-- ⑧ keep the answer: outputs back to memory -->
  <path d="M1450,346 V124 H470 V161" fill="none" stroke="#fb923c" stroke-opacity="0.8" stroke-width="2" marker-end="url(#am)"/>
  <g transform="translate(700,124)"><circle r="12" fill="#0b0f17" stroke="#fb923c" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fb923c">8</text></g>
  <text x="724" y="118" font-size="13" fill="#fdba74">keep the answer  <tspan fill="#94a3b8">(+ deferred memory proposals)</tspan></text>

  <!-- ===== edges (drawn under nodes) ===== -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="264" y1="520" x2="346" y2="520" marker-end="url(#a)"/>
    <line x1="594" y1="520" x2="696" y2="520" marker-end="url(#a)"/>
    <line x1="934" y1="520" x2="1036" y2="520" marker-end="url(#a)"/>
    <line x1="1274" y1="520" x2="1336" y2="520" marker-end="url(#a)"/>
    <line x1="470" y1="461" x2="470" y2="269" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="815" y1="461" x2="935" y2="269" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="1155" y1="461" x2="1075" y2="269" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="815" y1="579" x2="935" y2="771" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="1155" y1="579" x2="1075" y2="771" marker-end="url(#a)"/>
    <line x1="1240" y1="579" x2="1400" y2="771" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="6 5">
    <line x1="346" y1="215" x2="264" y2="215" marker-end="url(#a)"/>
    <line x1="1336" y1="825" x2="1134" y2="825" marker-end="url(#a)"/>
    <line x1="470" y1="771" x2="470" y2="579" marker-end="url(#a)"/>
  </g>

  <!-- edge labels -->
  <g font-size="13">
    <g transform="translate(305,500)"><circle r="12" fill="#0b0f17" stroke="#4ade80" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#4ade80">1</text></g>
    <text x="305" y="548" text-anchor="middle" fill="#94a3b8">message</text>

    <g transform="translate(496,316)"><circle r="12" fill="#0b0f17" stroke="#fb923c" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#fb923c">2</text></g>
    <text x="518" y="321" fill="#fdba74">recall <tspan fill="#94a3b8">10 turns + 10 memories</tspan></text>
    <g transform="translate(496,358)"><circle r="12" fill="#0b0f17" stroke="#fb923c" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#fb923c">3</text></g>
    <text x="518" y="363" fill="#fdba74">save <tspan fill="#94a3b8">the user turn</tspan></text>
    <g transform="translate(496,400)"><circle r="12" fill="#0b0f17" stroke="#fb923c" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#fb923c">5</text></g>
    <text x="518" y="405" fill="#fdba74">store <tspan fill="#94a3b8">what to remember</tspan></text>

    <g transform="translate(645,500)"><circle r="12" fill="#0b0f17" stroke="#a78bfa" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#a78bfa">4</text></g>
    <text x="645" y="548" text-anchor="middle" fill="#94a3b8">orchestrate()</text>

    <g transform="translate(985,500)"><circle r="12" fill="#0b0f17" stroke="#34d399" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#34d399">6</text></g>
    <text x="985" y="548" text-anchor="middle" fill="#94a3b8">run(tools)</text>

    <g transform="translate(1305,500)"><circle r="12" fill="#0b0f17" stroke="#4ade80" stroke-width="2"/><text y="4.5" text-anchor="middle" font-weight="700" fill="#4ade80">7</text></g>
    <text x="1305" y="548" text-anchor="middle" fill="#94a3b8">stream</text>

    <text x="816" y="440" text-anchor="end" fill="#94a3b8">pick tools + output</text>
    <text x="1148" y="400" fill="#94a3b8">reason · tool calls</text>
    <text x="862" y="690" text-anchor="end" fill="#94a3b8">discover(query)</text>
    <text x="1128" y="690" fill="#94a3b8">get(id)</text>
    <text x="1342" y="700" fill="#94a3b8">execute(args)</text>

    <text x="305" y="205" text-anchor="middle" fill="#64748b">persist</text>
    <text x="1235" y="815" text-anchor="middle" fill="#64748b">registered at boot</text>
    <text x="482" y="690" fill="#64748b">injected into every</text>
    <text x="482" y="708" fill="#64748b">constructor</text>
  </g>

  <!-- ===== nodes ===== -->
  <!-- inputs -->
  <g transform="translate(40,350)">
    <rect width="224" height="300" rx="12" fill="#0f1a14" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="16" y="26" font-size="11" fill="#4ade80">kind: input</text>
    <text x="16" y="52" font-size="20" font-weight="700" fill="#e2e8f0">Inputs</text>
    <g font-size="14" fill="#d1fae5">
      <g transform="translate(16,70)"><rect width="192" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❯</tspan> web-chat</text></g>
      <g transform="translate(16,110)"><rect width="192" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❯</tspan> telegram</text></g>
      <g transform="translate(16,150)"><rect width="192" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❯</tspan> voice-live</text></g>
      <g transform="translate(16,190)"><rect width="192" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❯</tspan> cronjob</text></g>
      <g transform="translate(16,230)"><rect width="192" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❯</tspan> openai-api</text></g>
    </g>
    <text x="16" y="286" font-size="11" fill="#64748b">start(listener), auto-restart</text>
  </g>

  <!-- runtime -->
  <rect x="350" y="465" width="240" height="110" rx="12" fill="#6366f1" opacity="0.35" filter="url(#glow)"/>
  <g transform="translate(350,465)">
    <rect width="240" height="110" rx="12" fill="#111735" stroke="#818cf8"/>
    <text x="16" y="26" font-size="11" fill="#818cf8">host</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#e0e7ff">Runtime</text>
    <text x="16" y="76" font-size="12" fill="#a5b4fc">AgentRuntime.process</text>
    <text x="16" y="96" font-size="12" fill="#64748b">drives every step</text>
  </g>

  <!-- memory -->
  <g transform="translate(350,165)">
    <rect width="240" height="100" rx="12" fill="#fb923c" fill-opacity="0.1" stroke="#fb923c"/>
    <text x="16" y="26" font-size="11" fill="#fb923c">kind: memory</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#ffedd5">Memory</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">graph · decay · vectors</text>
  </g>

  <!-- database -->
  <g transform="translate(40,165)">
    <rect width="224" height="100" rx="12" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24"/>
    <text x="16" y="26" font-size="11" fill="#fbbf24">kind: database</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#fef3c7">Database</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">SQLite · scoped per plugin</text>
  </g>

  <!-- orchestrator -->
  <g transform="translate(700,465)">
    <rect width="234" height="110" rx="12" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa"/>
    <text x="16" y="26" font-size="11" fill="#a78bfa">kind: orchestrator</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#ede9fe">Orchestrator</text>
    <text x="16" y="76" font-size="12" fill="#94a3b8">which tools, which output,</text>
    <text x="16" y="94" font-size="12" fill="#94a3b8">what to remember</text>
  </g>

  <!-- llm -->
  <g transform="translate(880,165)">
    <rect width="250" height="100" rx="12" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6"/>
    <text x="16" y="26" font-size="11" fill="#f472b6">kind: system2</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#fce7f3">LLM</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">codex · any provider plugin</text>
  </g>

  <!-- agent loop -->
  <g transform="translate(1040,465)">
    <rect width="234" height="110" rx="12" fill="#34d399" fill-opacity="0.1" stroke="#34d399"/>
    <text x="16" y="26" font-size="11" fill="#34d399">kind: agent</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#d1fae5">Agent Loop</text>
    <text x="16" y="76" font-size="12" fill="#94a3b8">↻ model ⇄ tools</text>
    <text x="16" y="94" font-size="12" fill="#94a3b8">until answer or maxSteps</text>
  </g>

  <!-- outputs -->
  <g transform="translate(1340,350)">
    <rect width="220" height="300" rx="12" fill="#0f1a14" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="16" y="26" font-size="11" fill="#4ade80">kind: output</text>
    <text x="16" y="52" font-size="20" font-weight="700" fill="#e2e8f0">Outputs</text>
    <g font-size="14" fill="#d1fae5">
      <g transform="translate(16,70)"><rect width="188" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❮</tspan> web-chat</text></g>
      <g transform="translate(16,110)"><rect width="188" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❮</tspan> telegram</text></g>
      <g transform="translate(16,150)"><rect width="188" height="32" rx="7" fill="#052e16" stroke="#22c55e" stroke-opacity="0.5"/><text x="12" y="21"><tspan fill="#4ade80">❮</tspan> openai-api</text></g>
    </g>
    <text x="16" y="216" font-size="12" fill="#94a3b8">one gets the live stream,</text>
    <text x="16" y="234" font-size="12" fill="#94a3b8">others the finished text</text>
    <text x="16" y="270" font-size="11" fill="#64748b">+ additionalOutputs</text>
    <text x="16" y="286" font-size="11" fill="#64748b">  copies on request</text>
  </g>

  <!-- env -->
  <g transform="translate(350,775)">
    <rect width="240" height="100" rx="12" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8"/>
    <text x="16" y="26" font-size="11" fill="#94a3b8">kind: env</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#f1f5f9">Env</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">.env · secrets · config</text>
  </g>

  <!-- discovery -->
  <g transform="translate(880,775)">
    <rect width="250" height="100" rx="12" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee"/>
    <text x="16" y="26" font-size="11" fill="#22d3ee">kind: discovery</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#cffafe">Discovery</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">tool registry · search</text>
  </g>

  <!-- actions -->
  <g transform="translate(1340,775)">
    <rect width="220" height="100" rx="12" fill="#a3e635" fill-opacity="0.1" stroke="#a3e635"/>
    <text x="16" y="26" font-size="11" fill="#a3e635">kind: action</text>
    <text x="16" y="54" font-size="20" font-weight="700" fill="#ecfccb">Actions</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">search · home · ssh…</text>
  </g>

  <!-- boot strip -->
  <rect x="40" y="908" width="1520" height="64" rx="10" fill="#111827" stroke="#334155" stroke-dasharray="6 5"/>
  <text x="64" y="935" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">BOOT</text>
  <text x="130" y="935" font-size="13" fill="#cbd5e1">plaios.yaml <tspan fill="#64748b">▸</tspan> install from npm registry <tspan fill="#64748b">▸</tspan> read each agent-os.package.yaml <tspan fill="#64748b">▸</tspan> register actions in discovery <tspan fill="#64748b">▸</tspan> serve :3100</text>
  <text x="130" y="958" font-size="13" fill="#94a3b8">build in dependency order: <tspan fill="#cbd5e1">env → database → system2 → discovery → memory → agent → orchestrator → inputs / outputs</tspan></text>
</svg>
